<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Server Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231668dc'/><path d='M8 20l5-6 4 4 7-8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme-init.js"></script>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-text">
          <span class="brand-name">Server Monitor</span>
        </span>
      </div>
      <nav id="nav"></nav>
      <span class="nav-spacer"></span>
      <button class="nav-item" id="langToggle" type="button" title="Language">🌐<span class="brand-text">EN / FA</span></button>
      <button class="nav-item" id="themeToggle" type="button" title="Theme"></button>
      <button class="nav-item" id="logout" type="button">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="brand-text">Sign out</span>
      </button>
    </aside>

    <div class="content-shell">
      <main class="content-area" id="view"></main>
    </div>
  </div>

  <div class="toast-host" id="toasts"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
