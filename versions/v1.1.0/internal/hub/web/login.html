<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in — Server Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231668dc'/><path d='M8 20l5-6 4 4 7-8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme-init.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="login-head">
        <div class="brand-mark">◆</div>
        <div class="brand-name" style="font-size:17px">Server Monitor</div>
        <div class="brand-ver" id="subtitle">Central monitoring dashboard</div>
      </div>

      <div class="field">
        <label for="username" id="usernameLabel">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password" id="passwordLabel">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn primary" style="width:100%;height:36px" type="submit" id="submit">Sign in</button>
      <div class="ov-sub" id="error" style="color:var(--crit);min-height:18px;margin-top:10px"></div>
    </form>
  </div>

  <script type="module" src="/assets/login.js"></script>
</body>
</html>
